server:
  port: 8080

spring:
  application:
    name: url-shortener

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:urlshortener}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-change-in-production-please-1234567890}
    expiration-ms: 86400000

  shortener:
    base-url: ${BASE_URL:http://localhost:8080}
    code-length: 7

  rate-limit:
    capacity: 20
    refill-tokens: 20
    refill-duration-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics